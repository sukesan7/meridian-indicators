name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test repository tooling
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Check repository formatting
        run: python tools/format_repo.py --check
      - name: Run static validation
        run: python tools/validate_repo.py
