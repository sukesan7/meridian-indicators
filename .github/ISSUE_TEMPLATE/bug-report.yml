name: Bug report
description: Report reproducible calculation, display or alert behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: indicator
    attributes:
      label: Indicator
      options:
        - Options Levels
        - Options Context
        - Futures Levels
        - Futures Context
        - Futures Profile
        - Futures Setups Daily
        - Futures Setups Research
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "Example: 0.3.6-beta"
    validations:
      required: true
  - type: input
    id: chart
    attributes:
      label: Symbol, timeframe and session
      placeholder: "Example: CME_MINI:NQ1!, 1m, extended hours, America/New_York"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the affected date/time and relevant settings.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction evidence
      description: Add screenshots, Bar Replay steps or a minimal settings list.
